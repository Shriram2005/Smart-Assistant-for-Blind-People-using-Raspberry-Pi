<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Aid Translation Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #2c3e50;
        }
        .card {
            border: none;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .translation-image {
            max-height: 200px;
            object-fit: contain;
            border-radius: 5px;
        }
        .timestamp {
            font-size: 0.8em;
            color: #6c757d;
        }
        .language-label {
            font-weight: bold;
            color: #2c3e50;
        }
        .translation-text {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
        }
        .pagination {
            justify-content: center;
            margin-top: 20px;
        }
        .search-box {
            max-width: 500px;
            margin: 20px auto;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        .no-data {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-language me-2"></i>Smart Aid Translation Dashboard
            </span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Search Box -->
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Search translations...">
                <button class="btn btn-primary" type="button" id="searchButton">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
            </div>
            </div>

        <!-- Translations Container -->
        <div id="translationsContainer"></div>

        <!-- Pagination -->
        <nav aria-label="Page navigation">
            <ul class="pagination" id="pagination"></ul>
        </nav>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;

        // Function to show loading spinner
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        // Function to hide loading spinner
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Function to format timestamp
        function formatTimestamp(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        // Function to create translation card
        function createTranslationCard(translation) {
            return `
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <img src="data:image/jpeg;base64,${translation.image}" 
                                     class="translation-image img-fluid" 
                                     alt="Captured Image">
                            </div>
                            <div class="col-md-8">
                                <div class="timestamp mb-2">
                                    <i class="far fa-clock me-1"></i>${formatTimestamp(translation.timestamp)}
                                </div>
                                
                                <div class="translation-block mb-3">
                                    <div class="language-label">Original Text:</div>
                                    <div class="translation-text">${translation.original_text || 'N/A'}</div>
                                </div>

                                <div class="translation-block mb-3">
                                    <div class="language-label">English Translation:</div>
                                    <div class="translation-text">${translation.english_translation || 'N/A'}</div>
                                </div>

                                <div class="translation-block mb-3">
                                    <div class="language-label">Hindi Translation:</div>
                                    <div class="translation-text">${translation.hindi_translation || 'N/A'}</div>
                                </div>

                                <div class="translation-block">
                                    <div class="language-label">Marathi Translation:</div>
                                    <div class="translation-text">${translation.marathi_translation || 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Function to load translations
        async function loadTranslations(page = 1) {
            showLoading();
            try {
                const response = await fetch(`db_connect.php?action=get_translations&page=${page}`);
                const data = await response.json();
                
                if (data.status === 'error') {
                    throw new Error(data.message);
                }

                const container = document.getElementById('translationsContainer');
                
                if (!data.data || data.data.length === 0) {
                    container.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <h4>No translations found</h4>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.data.map(createTranslationCard).join('');
                
                // Update pagination
                updatePagination(data.current_page, data.total_pages);
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('translationsContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        ${error.message || 'Error loading translations'}
                    </div>
                `;
            } finally {
                hideLoading();
            }
        }

        // Function to update pagination
        function updatePagination(currentPage, totalPages) {
            const pagination = document.getElementById('pagination');
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}">Previous</a>
                </li>
            `;
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                paginationHTML += `
                    <li class="page-item ${currentPage === i ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `;
            }
            
            // Next button
            paginationHTML += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}">Next</a>
                </li>
            `;
            
            pagination.innerHTML = paginationHTML;
            
            // Add click events to pagination
            pagination.querySelectorAll('.page-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = parseInt(e.target.dataset.page);
                    if (page && page !== currentPage) {
                        loadTranslations(page);
                    }
                });
            });
        }

        // Function to handle search
        async function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                loadTranslations(1);
                return;
            }

            showLoading();
            try {
                const response = await fetch(`db_connect.php?action=search&term=${encodeURIComponent(searchTerm)}`);
                const data = await response.json();

                if (data.status === 'error') {
                    throw new Error(data.message);
                }

                const container = document.getElementById('translationsContainer');
                
                    if (!data.data || data.data.length === 0) {
                    container.innerHTML = `
                                <div class="no-data">
                            <i class="fas fa-search fa-3x mb-3"></i>
                            <h4>No results found for "${searchTerm}"</h4>
                            </div>
                        `;
                    return;
                }

                container.innerHTML = data.data.map(createTranslationCard).join('');
                document.getElementById('pagination').innerHTML = ''; // Hide pagination during search
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('translationsContainer').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        ${error.message || 'Error searching translations'}
                    </div>
                `;
            } finally {
                hideLoading();
            }
        }

        // Event Listeners
        document.getElementById('searchButton').addEventListener('click', handleSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        // Load initial data
        document.addEventListener('DOMContentLoaded', () => {
            loadTranslations(1);
        });
    </script>
</body>
</html>
